<script>
  // Start the geo lookup in parallel with module loading instead of after it; user.js reuses it.
  // Mirrors User.getGeolocation/getUserLocale from @repobit/dex-utils.
  (function startGeoLookup() {
    var host = window.location.hostname;
    var geoOrigin = ['dev1.', 'dev2.', 'dev3.', 'dev4.', 'localhost', 'bitdefender.aem.', '.adobeaemcloud.com']
      .some(function isNonProd(part) { return host.includes(part); }) ? 'https://www.bitdefender.com' : window.location.origin;
    var wwwOrigin = host.includes('www.') ? '' : 'https://www.bitdefender.com';
    var country = fetch(geoOrigin + '/geoip')
      .then(function toJson(resp) { return resp.ok ? resp.json() : { error_code: resp.status }; })
      .then(function toCountry(data) { return data.error_code ? 'us' : data.country.toLowerCase(); })
      .catch(function fallback() { return 'us'; });
    var locale = country
      .then(function fetchLocales(code) { return fetch(wwwOrigin + '/p-api/v1/countries/' + code.toUpperCase() + '/locales'); })
      .then(function toJson(resp) { return resp.json(); })
      .then(function toLocale(data) { return data[0].locale.toLowerCase(); })
      .catch(function fallback() { return 'en-us'; });
    window.earlyGeo = { country: country, locale: locale };
  }());
</script>
